<!DOCTYPE html>

<head>

<body>
    <section class="contact_navigation">
      <div class="left">
        <img src="./assets/Map Pin.svg" alt="map" /> Store Location: Lincoln-

      </div>

      <div class="right">
        <div class="language">Eng <i class="fa-solid fa-angle-down"></i></div>

              <img src="./assets/Cart.svg" />

                <li>
                    <a href="./contact.html" class="nav_item" target="_self">Contact Us</a>
                </li>

           <img src="./assets/PhoneCall.svg" alt="phone"> <span>(219) 555-0114</span>

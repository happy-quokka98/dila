<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curved Cross Shape</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <section class="info">
      <div class="days">
        <p><span>Mon-Thu:</span> 9:00 AM - 5:30 PM</p>
      </div>

      <div class="address">
        <p>
          Visit our showroom in 1234 Street Adress City Address, 1234
          <a href="#">Contact Us <span class="line"></span></a>
        </p>
      </div>

      <div class="tel">
        <p>
          Call Us: (00) 1234 5678 <i class="fa-brands fa-square-facebook"></i>
          <i class="fa-brands fa-square-instagram"></i>
        </p>
      </div>
    </section>

    <nav>
      <div class="navbar">
        <div class="logo"><img src="./Vector 24.png" alt="logo" /></div>
        <div class="menu">
          <div class="menu-element">Laptops</div>
          <div class="menu-element">Desktop PCs</div>
          <div class="menu-element">Networking Devices</div>
          <div class="menu-element">Printers & Scanners</div>
          <div class="menu-element">PC Parts</div>
          <div class="menu-element">All Other Products</div>
          <div class="menu-element">Repairs</div>
          <button class="deal">Our Deals</button>
        </div>
      </div>

      <div class="dash">
        <div class="search"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="cart"><i class="fa-solid fa-cart-shopping"></i> <div class="checkout">2</div></div>
        <div class="profile">
          <img src="./istockphoto-2218333130-612x612.jpg" alt="profile" />
        </div>
      </div>
    </nav>


    <header>
        <img src="./Group 56.png" alt="header"/>
    </header>


    <section class="product-catalog">
        <div class="title">
            <div class="prod">New Products</div>
            <div class="serv">See All New Products</div>
        </div>

        <div class="cards">
            <div class="card">
                <div class="stock"><i class="fa-solid fa-circle-check"></i> in stock</div>
                <div class="image"><img src="./image 29.png" alt="product"/></div>
                <div class="review"></div>
            </div>


            




        </div>
    </section>
  </body>
</html>

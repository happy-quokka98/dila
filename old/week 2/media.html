<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <video controls loop autoplay muted>
        <source src="./Countdown 5 seconds timer.mp4" type="video/mp4">
        <source src="./Countdown 5 seconds timer.ogg" type="video/ogg">
    </video>

    <audio controls loop autoplay muted>
        <source src="./Countdown 5 seconds timer.mp4">
    </audio>

    <picture>
        <source media="(min-width: 1200px)" srcset="./Batumi.jpg">
        <source media="(min-width: 1000px)" srcset="./regions-of-georgia-mapwbp.png">
        <source media="(min-width: 600px)" srcset="./images.jpg">

        <img src="./image-resources2.jpg" alt="cat">
    </picture>

    <picture>
      <source media="(max-width: 600px)" srcset="./images.jpg" />
      <source media="(max-width: 1000px)" srcset="./regions-of-georgia-mapwbp.png" />
      <source media="(max-width: 1200px)" srcset="./Batumi.jpg" />
      <img src="./image-resources2.jpg" alt="cat" />

</html>
